version: '3.8'

# Entorno con Docker. Guía completa en docs/DESPLIEGUE.md.
#
# La aplicación lee su configuración del .env montado con el código; para
# este entorno debe llevar DB_HOST=db, APP_URL= (vacío) y las credenciales
# de la base de abajo (DB_USER=sena_user). En un servidor real, cambia
# estas contraseñas antes del primer arranque.

services:
  app:
    build: .
    container_name: sena_app_manuel
    restart: always
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sena_db_manuel
    restart: always
    environment:
      MYSQL_DATABASE: sena_seguimiento
      MYSQL_USER: sena_user
      MYSQL_PASSWORD: sena_password
      MYSQL_ROOT_PASSWORD: sena_root_password
    volumes:
      - sena_db_data:/var/lib/mysql
      # Solo en el primer arranque (volumen vacío) se crea la estructura
      # desde el esquema versionado. Después hay que registrar las
      # migraciones una vez:  docker compose exec app php bin/migrar.php
      # Antes se montaba ./sena_seguimiento.sql, un volcado local que no
      # está en el repositorio: en un clon limpio la base quedaba vacía.
      - ./database/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro

volumes:
  sena_db_data:
